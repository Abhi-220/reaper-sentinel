services:
  ollama:
    image: ollama/ollama:latest
    container_name: reaper-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  reaper:
    build: .
    container_name: reaper-sentinel
    depends_on:
      - ollama
    environment:
      # Correct internal networking for containers
      OLLAMA_HOST: "http://ollama:11434"
      MODEL_NAME: "mistral"

      # Optional — you can override analyzer timeout via compose
      ANALYZER_TIMEOUT: 120

    ports:
      - "8000:8000"   # Backend
      - "8501:8501"   # Dashboard

    volumes:
      - reaper_data:/app/data
      - reaper_logs:/app/logs

    restart: unless-stopped

volumes:
  reaper_data:
  reaper_logs:
  ollama_models:
