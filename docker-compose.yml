version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: reaper-ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  reaper:
    build: .
    container_name: reaper-sentinel
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      MODEL_NAME: "mistral"     # users can override
    volumes:
      - reaper_data:/app/data
      - reaper_logs:/app/logs
    ports:
      - "8000:8000"   # FastAPI backend
      - "8501:8501"   # Streamlit dashboard
    restart: unless-stopped

volumes:
  reaper_data:
  reaper_logs:
  ollama_models:
