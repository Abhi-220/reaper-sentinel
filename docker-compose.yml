version: "3.9"

services:
  # 🧠 Ollama AI Engine
  ollama:
    image: ollama/ollama:latest
    container_name: reaper-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  # ⚔️ Reaper Sentinel Core
  reaper:
    build: .
    container_name: reaper-sentinel
    depends_on:
      - ollama
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MODEL_NAME=mistral
      - MODE=prod
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  ollama_models:
